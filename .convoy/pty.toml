prefix = "hetz.pty-rust"

[sessions.claude]
id = "hetz.pty-rust"
command = "exec claude --permission-mode bypassPermissions 'You just cold-started. Run your boot ritual now: set your st status to available and drain your inbox (read, act on, and archive each message). Then stand by for work delivered via ding.'"

[sessions.claude.tags]
role = "agent"
strategy = "permanent"
"st.network" = "/home/myobie/.local/state/convoy/default"

[sessions.claude.env]
ST_AGENT = "hetz.pty-rust-claude"
ST_ROOT = "/home/myobie/.local/state/convoy/default/smalltalk"
PTY_ROOT = "/home/myobie/.local/state/convoy/default/pty"

[sessions.ding]
id = "hetz.pty-rust.ding"
command = "st ding hetz.pty-rust --identity hetz.pty-rust-claude --root /home/myobie/.local/state/convoy/default/smalltalk"

[sessions.ding.tags]
role = "ding"
strategy = "permanent"
"st.network" = "/home/myobie/.local/state/convoy/default"

[sessions.ding.env]
ST_AGENT = "hetz.pty-rust-claude"
ST_ROOT = "/home/myobie/.local/state/convoy/default/smalltalk"
PTY_ROOT = "/home/myobie/.local/state/convoy/default/pty"
