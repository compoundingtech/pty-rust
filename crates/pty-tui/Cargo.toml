[package]
name = "pty-tui"
description = "TUI library for pty on ratatui + crossterm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["all-widgets", "crossterm_0_29", "layout-cache", "underline-color"] }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
libc.workspace = true
pty-core.workspace = true
pty-terminal.workspace = true
